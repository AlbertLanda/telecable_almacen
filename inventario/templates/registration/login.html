{% extends 'base.html' %}
{% load static %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
    /* --- CAPA SUPERIOR (Overlay) --- */
    .login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #0f1220; 
        z-index: 9999;       
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;    
    }

    /* EL FONDO ANIMADO */
    #particles-js {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(135deg, rgba(10, 12, 20, 0.9), rgba(15, 18, 32, 0.8)), 
                          url('https://tse1.mm.bing.net/th/id/OIP.p1q7DqJmgvK4VAnVNQu3uQHaEM?rs=1&pid=ImgDetMain&o=7&rm=3');
        background-size: cover;
        background-position: center;
        z-index: 1;
    }

    /* LA TARJETA */
    .login-card {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 400px;
        padding: 40px;
        background: rgba(30, 34, 50, 0.3); 
        backdrop-filter: blur(15px);        
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        box-shadow: 0 0 40px rgba(79, 172, 254, 0.1); 
        animation: slideUp 0.8s ease-out;
        text-align: center;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(50px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* --- ESTILOS DE ELEMENTOS --- */
    .logo-glow {
        width: 70px; height: 70px;
        margin: 0 auto 20px;
        background: rgba(79, 172, 254, 0.1);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 35px; color: #4facfe;
        box-shadow: 0 0 20px rgba(79, 172, 254, 0.3);
        border: 1px solid rgba(79, 172, 254, 0.3);
    }

    .login-title { color: #fff; font-size: 26px; font-weight: 700; margin-bottom: 5px; letter-spacing: 1px; }
    .login-subtitle { color: #8b9bb4; font-size: 13px; margin-bottom: 30px; letter-spacing: 0.5px; }

    .input-box { position: relative; margin-bottom: 20px; }
    
    /* Ícono Izquierdo (Usuario/Candado) */
    .input-icon-left {
        position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
        color: #4facfe; font-size: 18px; pointer-events: none; /* El click pasa a través */
    }

    /* Ícono Derecho (El Ojito) */
    .input-icon-right {
        position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
        color: #8b9bb4; font-size: 20px; cursor: pointer; transition: 0.3s;
        z-index: 20;
    }
    .input-icon-right:hover { color: #fff; }
    
    .form-control-login {
        width: 100%;
        padding: 12px 45px 12px 45px; /* Espacio a ambos lados para los íconos */
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: #fff;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }
    .form-control-login:focus {
        border-color: #4facfe;
        box-shadow: 0 0 15px rgba(79, 172, 254, 0.2);
        background: rgba(0, 0, 0, 0.5);
    }

    .btn-login {
        width: 100%; padding: 14px;
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        border: none; border-radius: 10px;
        color: #000; font-weight: 700; font-size: 16px;
        cursor: pointer; margin-top: 10px;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5); }

    .footer { margin-top: 25px; color: #555; font-size: 11px; }
</style>

<div class="login-overlay">
    <div id="particles-js"></div>

    <div class="login-card">
        <div class="logo-glow">
            <i class='bx bx-cube-alt'></i>
        </div>
        
        <h2 class="login-title">TELECABLE</h2>
        <p class="login-subtitle">Acceso Seguro al Almacén</p>

        <form method="POST">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger p-2 mb-3 small" style="background: rgba(255, 69, 58, 0.2); color: #ff6b6b; border: 1px solid #ff6b6b; border-radius: 8px;">
                    Usuario o contraseña incorrectos
                </div>
            {% endif %}

            <div class="input-box">
                <i class='bx bx-user input-icon-left'></i>
                <input type="text" name="username" class="form-control-login" placeholder="ID de Empleado" required autocomplete="off">
            </div>

            <div class="input-box">
                <i class='bx bx-lock-alt input-icon-left'></i>
                <input type="password" name="password" id="passwordInput" class="form-control-login" placeholder="Contraseña" required>
                <i class='bx bx-show input-icon-right' id="togglePassword"></i>
            </div>

            <button type="submit" class="btn-login">INGRESAR AL SISTEMA</button>
        </form>

        <div class="footer">© 2026 Telecable S.A. | V 2.0</div>
    </div>
</div>

<script>
    /* 1. LÓGICA DEL OJITO */
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#passwordInput');

    togglePassword.addEventListener('click', function (e) {
        // Cambiar el tipo de input
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        // Cambiar el ícono (Ojo abierto / Ojo tachado)
        this.classList.toggle('bx-show');
        this.classList.toggle('bx-hide');
        
        // Efecto visual de color
        if(type === 'text'){
            this.style.color = '#4facfe'; // Azul cuando se ve
        } else {
            this.style.color = '#8b9bb4'; // Gris cuando está oculto
        }
    });

    /* 2. CONFIGURACIÓN DE PARTÍCULAS */
    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
            "color": { "value": "#4facfe" },
            "shape": { "type": "circle" },
            "opacity": { "value": 0.5, "random": true },
            "size": { "value": 3, "random": true },
            "line_linked": {
                "enable": true, "distance": 150, "color": "#4facfe", "opacity": 0.4, "width": 1
            },
            "move": {
                "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false,
            }
        },
        "interactivity": {
            "detect_on": "canvas",
            "events": {
                "onhover": { "enable": true, "mode": "grab" },
                "onclick": { "enable": true, "mode": "push" },
                "resize": true
            },
            "modes": {
                "grab": { "distance": 140, "line_linked": { "opacity": 1 } },
                "push": { "particles_nb": 4 }
            }
        },
        "retina_detect": true
    });
</script>
{% endblock %}
